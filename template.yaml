AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: CloudSense ingestion, processing, storage, alerts, and dashboard query stack.

Parameters:
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address subscribed to CloudSense alerts.
  DashboardAllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173"
    Description: Browser origins allowed to call the API (scheme, host, and port).

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Resources:
  ReadingDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  ReadingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "cloudsense-http-ingest-test-${AWS::AccountId}"
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReadingDeadLetterQueue.Arn
        maxReceiveCount: 5

  AlertStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: DeviceTimeIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: CloudSense health alerts

  AlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      Protocol: email
      TopicArn: !Ref AlertsTopic
      Endpoint: !Ref AlertEmail

  ReadingsHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref DashboardAllowedOrigins
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [Content-Type, Authorization]
        ExposeHeaders: [x-request-id]
        MaxAge: 300

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloudsense-http-ingest-test
      CodeUri: src/
      Handler: ingest.app.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 10
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          READING_QUEUE_URL: !Ref ReadingQueue
      Events:
        PostReading:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadingsHttpApi
            Path: /readings
            Method: POST

  ProcessFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloudsense-process-alerts
      CodeUri: src/
      Handler: process.app.lambda_handler
      Runtime: python3.13
      MemorySize: 256
      Timeout: 60
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          ALERT_STATE_TABLE: !Ref AlertStateTable
          ALERTS_TOPIC_ARN: !Ref AlertsTopic
          ALERT_COOLDOWN_SECONDS: 300
          CLAIM_LEASE_SECONDS: 120
          MAX_READING_AGE_SECONDS: 300
          READING_HISTORY_RETENTION_SECONDS: 7776000
      Events:
        ProcessReadings:
          Type: SQS
          Properties:
            Queue: !GetAtt ReadingQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

  QueryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: cloudsense-query-readings
      CodeUri: src/
      Handler: query.app.lambda_handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 10
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          ALERT_STATE_TABLE: !Ref AlertStateTable
          DATA_STALE_SECONDS: 300
      Events:
        GetLatestReading:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadingsHttpApi
            Path: /devices/{device_id}/latest
            Method: GET
            PayloadFormatVersion: "2.0"
        GetReadingHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadingsHttpApi
            Path: /devices/{device_id}/history
            Method: GET
            PayloadFormatVersion: "2.0"
        GetAlertHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReadingsHttpApi
            Path: /devices/{device_id}/alerts
            Method: GET
            PayloadFormatVersion: "2.0"

Outputs:
  QueryApiBaseUrl:
    Description: Append /devices/{device_id}/latest, /history, or /alerts.
    Value: !Sub "https://${ReadingsHttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  QueryFunctionName:
    Description: Lambda serving dashboard queries.
    Value: !Ref QueryFunction

  ApiEndpoint:
    Description: API Gateway endpoint for the simulator.
    Value: !Sub "https://${ReadingsHttpApi}.execute-api.${AWS::Region}.amazonaws.com/readings"

  QueueUrl:
    Description: URL of the test reading queue.
    Value: !Ref ReadingQueue

  DeadLetterQueueUrl:
    Description: URL for readings that repeatedly fail processing.
    Value: !Ref ReadingDeadLetterQueue

  AlertTopicArn:
    Description: SNS topic ARN used for alerts.
    Value: !Ref AlertsTopic

  AlertStateTableName:
    Description: DynamoDB table used for readings, deduplication, and alert state.
    Value: !Ref AlertStateTable
